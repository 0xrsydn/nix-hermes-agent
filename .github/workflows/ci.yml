name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Candidate PRs opened by GITHUB_TOKEN dispatch this run themselves.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Every flake check, lint and script tests included. This is the only CI.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v13
      - name: nix flake check
        run: nix flake check --keep-going
