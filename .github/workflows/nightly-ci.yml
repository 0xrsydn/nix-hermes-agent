name: Nightly upstream check

on:
  schedule:
    - cron: "45 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v13
      - name: Build the lean layer against upstream main
        run: |
          nix build --keep-going --no-link --accept-flake-config \
            --override-input hermes-agent github:NousResearch/hermes-agent \
            .#checks.x86_64-linux.cli \
            .#checks.x86_64-linux.patches-live \
            .#checks.x86_64-linux.dependency-groups \
            .#checks.x86_64-linux.override-keeps-layer \
            .#checks.x86_64-linux.shared-tools
